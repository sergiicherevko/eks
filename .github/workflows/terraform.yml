name: terraform-dev

on:
  push:
    branches:
      - "feature/**"
      - "main"
  workflow_dispatch:
    inputs:
      action:
        description: "Choose what to run"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.IAM_ROLE }}
          aws-region: us-east-1

      - name: Terraform Init
        working-directory: envs/dev
        run: terraform init -reconfigure

      - name: Terraform Validate
        working-directory: envs/dev
        run: terraform validate

      - name: Terraform Plan
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'plan')
        working-directory: envs/dev
        run: terraform plan

      - name: Terraform Apply
        if: (github.event_name == 'push' && startsWith(github.ref_name, 'feature/')) || (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
        working-directory: envs/dev
        run: terraform apply -auto-approve

      - name: Terraform Destroy
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
        working-directory: envs/dev
        run: terraform destroy -auto-approve
